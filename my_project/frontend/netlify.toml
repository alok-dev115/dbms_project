# Netlify deploys only this static SPA. The Django API must be hosted separately
# (Render, Railway, Fly.io, etc.) and VITE_API_URL must point to that API.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
