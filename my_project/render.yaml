# Render Blueprint: free web service (sleeps when idle ~15 min; first request can be slow).
# Add env vars in the dashboard (secrets). MySQL must be reachable from the internet
# (TiDB Serverless, db4free, Aiven trial, etc.). Import your schema/data into that DB.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: real-estate-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn real_estate_api.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
